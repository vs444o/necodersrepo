{% extends "base.html" %}

{% block title %}Post a Request - HelpNow{% endblock %}

{% block content %}
<section class="container page-header">
    <h1>Post a request</h1>
    <p>Fill in the details clearly so helpers can respond quickly.</p>
</section>

<section class="container form-shell">
    <form method="post" class="app-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">What do you need?</label>
            <input id="title" type="text" name="title" required>
        </div>

        <div class="form-group">
            <label for="description">More details</label>
            <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
                {% for val, label in categories %}
                    <option value="{{ val }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="offer_type">Paid or volunteer?</label>
            <select id="offer_type" name="offer_type">
                <option value="paid">Paid</option>
                <option value="volunteer">Volunteer</option>
            </select>
        </div>

        <div class="form-group">
            <label for="price">Price (leave empty for volunteer)</label>
            <input id="price" type="number" name="price" step="0.01">
            <p class="help-text">Use this only when offer type is paid.</p>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input id="location" type="text" name="location" required>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Post request</button>
    </form>
</section>
{% endblock %}
