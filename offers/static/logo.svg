<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="baseGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   style="stop-color:#86efac"/>
      <stop offset="40%"  style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </radialGradient>

    <radialGradient id="rightShade" cx="70%" cy="60%" r="50%">
      <stop offset="0%"   style="stop-color:#14532d; stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#14532d; stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="bottomShade" cx="50%" cy="95%" r="40%">
      <stop offset="0%"   style="stop-color:#052e16; stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#052e16; stop-opacity:0"/>
    </radialGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   style="stop-color:white; stop-opacity:0.75"/>
      <stop offset="100%" style="stop-color:white; stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="shine2" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   style="stop-color:white; stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:white; stop-opacity:0"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#052e16" flood-opacity="0.5"/>
    </filter>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="2" result="offsetBlur"/>
      <feComposite in="offsetBlur" in2="SourceGraphic" operator="in" result="shadow"/>
      <feBlend in="SourceGraphic" in2="shadow" mode="multiply"/>
    </filter>
  </defs>

  <!-- Main heart body -->
  <path d="
    M32 53
    C31 52 27 49 23 46
    C15 40 9 34 7.5 26
    C6 18 9 10.5 16 8.5
    C20 7.3 24.5 8.5 27.5 11.5
    C29 13 30.5 14.5 32 14.5
    C33.5 14.5 35 13 36.5 11.5
    C39.5 8.5 44 7.3 48 8.5
    C55 10.5 58 18 56.5 26
    C55 34 49 40 41 46
    C37 49 33 52 32 53Z"
    fill="url(#baseGrad)"
    filter="url(#shadow)"/>

  <!-- Right/bottom darkening for roundness -->
  <path d="
    M32 53
    C31 52 27 49 23 46
    C15 40 9 34 7.5 26
    C6 18 9 10.5 16 8.5
    C20 7.3 24.5 8.5 27.5 11.5
    C29 13 30.5 14.5 32 14.5
    C33.5 14.5 35 13 36.5 11.5
    C39.5 8.5 44 7.3 48 8.5
    C55 10.5 58 18 56.5 26
    C55 34 49 40 41 46
    C37 49 33 52 32 53Z"
    fill="url(#rightShade)"/>

  <!-- Bottom tip darkening -->
  <path d="
    M32 53
    C31 52 27 49 23 46
    C15 40 9 34 7.5 26
    C6 18 9 10.5 16 8.5
    C20 7.3 24.5 8.5 27.5 11.5
    C29 13 30.5 14.5 32 14.5
    C33.5 14.5 35 13 36.5 11.5
    C39.5 8.5 44 7.3 48 8.5
    C55 10.5 58 18 56.5 26
    C55 34 49 40 41 46
    C37 49 33 52 32 53Z"
    fill="url(#bottomShade)"/>

  <!-- Primary gloss — upper left lobe -->
  <ellipse cx="21" cy="17" rx="8.5" ry="5"
    fill="url(#shineGrad)"
    transform="rotate(-40 21 17)"
    opacity="0.85"/>

  <!-- Secondary gloss — right lobe -->
  <ellipse cx="43" cy="18" rx="5.5" ry="3"
    fill="url(#shine2)"
    transform="rotate(-30 43 18)"
    opacity="0.5"/>

  <!-- Rim edge light on left side -->
  <path d="M16 10 C11 14 9 20 10 27 C11 32 14 37 18 41"
    stroke="white" stroke-width="1.5" stroke-linecap="round"
    fill="none" opacity="0.22"/>

  <!-- Cleft crease at top -->
  <path d="M28.5 13.5 C30 16 32 16.5 33.5 15 C34.5 14 35.5 13 35.5 13"
    stroke="#052e16" stroke-width="1.1" stroke-linecap="round"
    fill="none" opacity="0.35"/>

  <!-- Specular hotspot -->
  <ellipse cx="19" cy="15" rx="3" ry="2"
    fill="white" opacity="0.45"
    transform="rotate(-40 19 15)"/>
</svg>
